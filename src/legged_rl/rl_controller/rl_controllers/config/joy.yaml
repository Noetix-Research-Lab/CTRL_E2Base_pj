teleop:
  walk:
    type: topic
    message_type: geometry_msgs/Twist
    topic_name: cmd_vel
    deadman_buttons: []
    axis_mappings:
      - axis: 3
        target: angular.z
        scale: 1.0
      - axis: 1
        target: linear.x
        # Full forward/backward stick maps to +3.0/-1.0 respectively.
        scale_positive: 3.0
        scale_negative: 1.5
      - axis: 0
        target: linear.y
        scale: 1.0
  start_control:
    type: topic
    message_type: std_msgs/Float32
    topic_name: start_control
    deadman_buttons: [ 7 ]
    axis_mappings:
      - button: 7
        target: data
        scale: 2
        offset: 0
  switch_mode:
    type: topic
    message_type: std_msgs/Float32
    topic_name: switch_mode
    deadman_buttons: [6]
    axis_mappings:
      - button: 6
        target: data
        scale: 2
        offset: 0
  position_control:
    type: topic
    message_type: std_msgs/Float32
    topic_name: position_control
    deadman_buttons: [8]
    axis_mappings:
      - button: 8
        target: data
        scale: 2
        offset: 0
  walk_mode:
    type: topic
    message_type: std_msgs/Float32
    topic_name: walk_mode
    deadman_buttons: [4, 0]
    axis_mappings:
      - button: 0
        target: data
        scale: 2
        offset: 0
  dance_mode:
    type: topic
    message_type: std_msgs/Float32
    topic_name: dance_mode
    deadman_buttons: [5, 2]
    axis_mappings:
      - button: 2
        target: data
        scale: 2
        offset: 0
  down_mode:
    type: topic
    message_type: std_msgs/Float32
    topic_name: down_mode
    deadman_buttons: [5, 0]
    axis_mappings:
      - button: 0
        target: data
        scale: 2
        offset: 0
  up_mode:
    type: topic
    message_type: std_msgs/Float32
    topic_name: up_mode
    deadman_buttons: [5, 3]
    axis_mappings:
      - button: 3
        target: data
        scale: 2
        offset: 0
